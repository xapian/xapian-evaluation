name: CI

on:
  push:
    paths-ignore:
      - 'README'
  pull_request:
    branches: main
    paths-ignore:
      - 'README'

jobs:
  build:
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}

    strategy:
      # Don't abort other jobs if one fails.
      fail-fast: false
      matrix:
        include:
          - name: GLIBCXX_DEBUG
            CC: gcc
            CXX: g++
            CPPFLAGS: -D_GLIBCXX_DEBUG

          - name: clang
            CC: clang
            CXX: 'clang++ -stdlib=libc++'
            extra_packages: clang libc++-dev

          - name: GCC-9
            os: ubuntu-22.04
            CC: gcc-9
            CXX: g++-9
            extra_packages: gcc-9 g++-9

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install CCache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.name }}
    - name: Install package dependencies
      run: |
        sudo apt-get update
        sudo apt-get install \
            autoconf \
            automake \
            libtool \
            ${{ matrix.extra_packages }}
    - name: bootstrap xapian-core
      run: |
        git clone https://github.com/xapian/xapian.git
        cd xapian
        ./bootstrap xapian-core
    - name: configure xapian-core
      run: |
        cd xapian
        ./configure --disable-documentation CC='ccache ${{ matrix.CC || 'gcc' }}' CXX='ccache ${{ matrix.CXX || 'g++' }}'
    - name: make xapian-core
      run: make -j2 -C xapian
    - name: bootstrap
      run: |
        export ACLOCAL="aclocal -I $PWD/xapian/xapian-core/m4-macros"
        autoreconf -fiv
    - name: configure
      run: ./configure XAPIAN_CONFIG=$PWD/xapian/xapian-core/xapian-config $confargs CC='ccache ${{ matrix.CC || 'gcc' }}' CXX='ccache ${{ matrix.CXX || 'g++' }}'
    - name: make
      run: make -j2 CFLAGS='-Wall -W -Werror' CXXFLAGS='-Wall -W -Werror'
    - name: Run tests
      run: make check CFLAGS='-Wall -W -Werror' CXXFLAGS='-Wall -W -Werror' VERBOSE=1 AUTOMATED_TESTING=1
    - name: Check generated files are in .gitignore
      # grep '^' passes through all input while giving a non-zero exit status
      # if that input is empty.
      run: |
        printf '%s\n' .ccache xapian > ".git/info/exclude"
        git status --porcelain|grep '^' && { echo "The generated files listed above are not in .gitignore" ; exit 1; }; true
